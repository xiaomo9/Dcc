name: Build release candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from pathlib import Path
          expected = 'v' + Path('src/VERSION').read_text().strip()
          assert os.environ['GITHUB_REF_NAME'] == expected, 'Release tag must match src/VERSION'
      - run: python -m pip install -r packaging/requirements.txt
      - name: Test source on macOS
        if: runner.os == 'macOS'
        run: python -m unittest discover -s tests
      - name: Test release configuration on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_release.py
      - name: Verify build architecture
        run: python -c "import platform; assert platform.machine().lower() in ({'arm64':'arm64','x64':'x86_64'}['${{ matrix.arch }}'], 'amd64' if '${{ matrix.arch }}' == 'x64' else 'arm64')"
      - run: python packaging/build.py
      - name: Smoke test packaged CLI and proxy
        run: python packaging/smoke.py
      - name: Create DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -R dist/DCC.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname DCC -srcfolder build/dmg -ov -format UDZO dist/DCC-macOS-${{ matrix.arch }}.dmg
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src/VERSION).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write SHA256 checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          paths = sorted([*Path('dist').glob('*.dmg'), *Path('dist').glob('*Setup.exe')])
          Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in paths))
      - uses: actions/upload-artifact@v4
        with:
          name: DCC-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
