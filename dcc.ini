[DEFAULT]
daye_src = ~/daye/src
# 注:daye_src 指向你的 daye 工程根目录,按实际路径修改

[proxy]
port = 4000
llm_ini_path = ~/.dm/llm.ini
pidfile_name = dcc-proxy.pid
proxy_log_name = dcc-proxy.log
proxy_config_name = config.json
ready_timeout = 15
# 日志保留天数 · 启动时清 log/ + exec_log/ + dumps/ 里老于 N 天的文件
# 覆盖顺序:环境变量 DCC_LOG_RETENTION_DAYS > 这里
retention_days = 3

[output]
dir = %(daye_src)s/docs/output/dcc

[cc]
binary =
session_root = %(daye_src)s/docs/output/dcc/sessions
instances_file = %(daye_src)s/docs/output/dcc/instances.json

[defaults]
model_suffix = [1m]
context_window = 700k

[models]
# 槽位 → ~/.dm/llm.ini section 名 · dcc 从 llm.ini 拿 base_url/api_key/model/protocol
# CLI_NAME 派生:去 oxygen- 前缀,保留 rag- 前缀(llm-gw 不带 · rag 带)
# 分流硬规则:
#   1) qwen 只给 aqa 不入 dcc · gemini 系不入 dcc(dcc 无 gemini 协议)
#   2) dcc 必须过 tools+本地文件读写(BASIC 连测3次 ≥半数过)
#   3) dcc 上下文 ≥ 1000k · LONGCTX 连测3次 ≥半数过
# slot 1-4:llm-gw 入口
#   1 DeepSeek-V4-Pro-JoyBuilder     openai
#   2 GPT-5.6-Luna-joybuilder        responses
#   3 GPT-5.6-Terra-joybuilder       responses
#   4 GPT-5.6-Sol-joybuilder         responses
# slot 5-8:rag 入口 · 走 openai /v1 端点(rag /anthropic 端点带 key 实测 55s 挂死)
#   5 rag-claude-opus-4-5     openai · 注:网关对 opus-4-5 实测兜底返回 GLM-5
#   6 rag-claude-opus-4-6     openai
#   7 rag-claude-opus-4-7     openai
#   8 rag-claude-opus-4-8     openai
1 = DeepSeek-V4-Pro-JoyBuilder
2 = GPT-5.6-Luna-joybuilder
3 = GPT-5.6-Terra-joybuilder
4 = GPT-5.6-Sol-joybuilder
5 = rag-claude-opus-4-5
6 = rag-claude-opus-4-6
7 = rag-claude-opus-4-7
8 = rag-claude-opus-4-8

[model_names]

[model_suffix]

[context]


[groups]
# 等价组 · 组内成员按声明顺序互为 failover 候选 · 仅同协议成员实际参与切换
# 启动某槽 → 在其所属组内 · 从该槽之后按顺序尝试下一个同协议候选(回绕组首)
# 现实提示(仅 openai 协议路径消费候选 · responses/anthropic 路径暂不切):
#   组A:slot1(openai)组内无同协议同伴=不切;slot2/3/4 均 responses,虽列候选但代码不消费=不切。
#   组B:slot5/6/7/8 现均为 openai,四者互为候选=当前唯一真正会自动切换的组。
A = 1,2,3,4
B = 5,6,7,8

[failover]
# 首字节软超时秒数 · 超过判定主模型慢 · 切组内下一同协议候选(仅首帧前 · 首帧后绝不切)
soft_timeout = 12
# 首帧前遇上游 429/5xx 是否立即切下一候选(true) · false=交链尾候选走原退避重试
switch_on_429 = true
# 单请求最多尝试候选个数(含主模型) · 防雪崩 · 1=关闭切换(退化为今日单模型)
max_candidates = 3
